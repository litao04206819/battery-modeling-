[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmr"
version = "0.1.0"
description = "Coupled battery (PyBaMM DFN) - motor (PMSM) - rotor (BEMT) system model for multirotor / eVTOL propulsion"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "battery-modeling-" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pybamm>=24.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
